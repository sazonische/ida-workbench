name: Windows

# One build, one artifact: the self-contained static exe. vcpkg compiles a static Qt from
# source, so the first run on a cold package cache is measured in hours while every later
# run restores the archives in minutes — which is why the archives are saved even when a
# later step fails (see "Save vcpkg packages").
on:
  push:
    # No branch, PR or manual trigger: publishing starts with a pushed version tag.
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag build half-way through: its artifact becomes a release.
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  meta:
    name: Project version
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # On a tag, the tag *is* the version: it names the release, so the build reports it
      # (-DIDA_WORKBENCH_VERSION) and the artifact is named after it. Push the tag;
      # project(VERSION) remains the default for local builds only.
      - id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::this workflow accepts version tags only"
            exit 1
          fi
          declared=$(sed -nE 's/^project\(ida_workbench VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [ -z "$declared" ]; then echo "project(VERSION ...) not found in CMakeLists.txt" >&2; exit 1; fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tags must be vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH (for example v2.0.0)"
            exit 1
          fi
          # VERSIONINFO stores each component in 16 bits. Reject invalid versions
          # before spending hours compiling Qt, and avoid shell integer overflow.
          IFS=. read -r major minor patch <<< "$version"
          for component in "$major" "$minor" "$patch"; do
            if [ "${#component}" -gt 5 ] || [ "$component" -gt 65535 ]; then
              echo "::error::Windows version components must be between 0 and 65535"
              exit 1
            fi
          done
          if [ "$version" != "$declared" ]; then
            echo "::notice::building tag $GITHUB_REF_NAME as version $version; project(VERSION) still says $declared — the tag wins, syncing CMakeLists is optional"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version (declared $declared, $GITHUB_REF_TYPE $GITHUB_REF_NAME)"

  build:
    name: Static exe
    needs: meta
    runs-on: windows-2025
    timeout-minutes: 360 # a cold qtbase build is measured in hours, not minutes
    permissions:
      contents: read
      id-token: write     # both needed by the build provenance attestation below
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # The cache holds vcpkg's built package archives, not its source tree: a different
      # vcpkg commit means different port versions, which invalidates every archive. The
      # runner image bumps its vcpkg every few weeks, so restore-keys let a stale cache
      # still seed the rebuild instead of starting from nothing.
      # The package spec is defined once, here, so the cache key moves with it. A feature
      # change invalidates every archive, and a key that ignored it would be worse than
      # useless: the exact hit skips the save step below, so the newly built archives
      # would never be stored and qtbase would rebuild from source on every run.
      - name: Resolve vcpkg revision and package spec
        id: vcpkg
        run: |
          $spec = "qtbase[core,doubleconversion,freetype,gui,harfbuzz,network,pcre2,png,thread,widgets]:x64-windows-static"
          $stream = [IO.MemoryStream]::new([Text.Encoding]::UTF8.GetBytes($spec))
          $specHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.Substring(0, 12)
          $sha = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          "spec=$spec" >> $env:GITHUB_OUTPUT
          "spec_hash=$specHash" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "$spec  (vcpkg $sha, spec $specHash)"

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-qtbase-static-complete-${{ steps.vcpkg.outputs.sha }}-${{ steps.vcpkg.outputs.spec_hash }}-${{ hashFiles('.github/vcpkg-triplets/*.cmake') }}
          # Same revision and spec first; then any older cache, because ports whose ABI did
          # not change (zlib, libpng, freetype, …) are still reused from it.
          restore-keys: |
            vcpkg-qtbase-static-complete-${{ steps.vcpkg.outputs.sha }}-${{ steps.vcpkg.outputs.spec_hash }}-
            vcpkg-qtbase-static-${{ steps.vcpkg.outputs.sha }}-${{ steps.vcpkg.outputs.spec_hash }}-
            vcpkg-qtbase-static-

      # The feature list is explicit, and `core` means "no default features". vcpkg's
      # defaults for qtbase additionally drag in icu, openssl, jpeg, zstd, brotli, sql
      # (with sql-psql, i.e. postgresql), dbus, opengl and testlib — hours of extra port
      # builds, and static icu alone grows the exe from 22 MB to 58 MB. Nothing here is
      # lost: the app links only Widgets and Network, and HTTPS keeps working without
      # openssl because Qt falls back to Windows schannel (QT_FEATURE_ssl stays 1).
      # --clean-buildtrees-after-build: qtbase's build tree is tens of gigabytes and the
      # runner disk is not.
      - name: Build static Qt
        id: qt
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "free on C: {0:N1} GB (before)" -f ((Get-PSDrive C).Free / 1GB)
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            "${{ steps.vcpkg.outputs.spec }}" `
            "--overlay-triplets=${{ github.workspace }}/.github/vcpkg-triplets" `
            --clean-buildtrees-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          "free on C: {0:N1} GB (after)" -f ((Get-PSDrive C).Free / 1GB)

      # Saved right after the expensive step and regardless of what follows: hours of
      # qtbase build must not be discarded because a test broke afterwards. Skipped on an
      # exact hit — there is nothing new to store then. Failed Qt builds must not
      # occupy that immutable cache key with an incomplete package set.
      - name: Save vcpkg packages
        if: always() && steps.qt.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # No -G: on Windows CMake picks the newest installed Visual Studio generator, so the
      # workflow keeps working when the runner image moves to a newer VS. The overlay is
      # not repeated here: in classic mode the toolchain only consumes the installed tree,
      # and passing it would just raise an unused-variable warning.
      - name: Configure
        run: >
          cmake -B build-static -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DBUILD_TESTING=ON
          "-DIDA_WORKBENCH_VERSION=${{ needs.meta.outputs.version }}"

      - name: Build
        run: cmake --build build-static --config Release

      - name: Test
        run: ctest --test-dir build-static -C Release --output-on-failure --no-tests=error

      # One file, nothing beside it. The python helpers are compiled into the exe and
      # unpacked next to config.json on launch, where ensureHelperScripts also refreshes
      # them; shipping copies here would only pin _scriptDir to the download folder, where
      # they are never refreshed and can silently outlive the exe that runs them.
      - name: Package
        run: |
          $exe = "ida-workbench-${{ needs.meta.outputs.version }}-windows-x64.exe"
          Copy-Item build-static/Release/ida-workbench.exe $exe
          $version = (Get-Item $exe).VersionInfo
          if ($version.FileVersion -ne "${{ needs.meta.outputs.version }}" -or $version.ProductVersion -ne "${{ needs.meta.outputs.version }}") {
            throw "Windows file version does not match the release tag"
          }
          # "Static" is a claim worth checking: the whole point of this artifact is that it
          # needs nothing but Windows system DLLs beside it. dumpbin lives in the MSVC
          # toolchain, which is not on PATH outside a developer prompt.
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found under $vsRoot" }
          $deps = & $dumpbin.FullName /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed ($LASTEXITCODE)" }
          if ($deps -match 'Qt6|VCRUNTIME|MSVCP|api-ms-win-crt') {
            throw "the static exe still imports a Qt or MSVC runtime DLL:`n$($deps -join "`n")"
          }
          # Logged so a jump in size (a stray Qt feature dragging icu back in) is visible
          # in the run output instead of only in the download.
          "exe size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      # The free stand-in for code signing. A certificate costs more per year than this
      # tool earns, so SmartScreen will warn on first run no matter what CI does; an
      # attestation at least lets anyone prove the exe came out of this workflow, from
      # this commit — `gh attestation verify <exe> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ida-workbench-${{ needs.meta.outputs.version }}-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ida-workbench-${{ needs.meta.outputs.version }}-windows-x64
          path: ida-workbench-${{ needs.meta.outputs.version }}-windows-x64.exe
          if-no-files-found: error

      # vcpkg reports only "BUILD_FAILED" and points at logs inside its buildtrees, which
      # die with the runner. A failed run here costs hours, so the logs come home with it.
      - name: Collect vcpkg logs
        if: failure()
        run: |
          New-Item -ItemType Directory -Force vcpkg-logs | Out-Null
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/buildtrees" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Select-Object -First 200 |
            ForEach-Object { Copy-Item $_.FullName (Join-Path "vcpkg-logs" ($_.Directory.Name + "_" + $_.Name)) -ErrorAction SilentlyContinue }
          Get-ChildItem vcpkg-logs -ErrorAction SilentlyContinue | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vcpkg-logs
          path: vcpkg-logs
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    # Publishing needs a pushed tag AND a successful build (including tests,
    # packaging, attestation and artifact upload). CI never creates tags itself.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ida-workbench-${{ needs.meta.outputs.version }}-windows-x64
          path: artifacts
      - name: Upload and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          asset="ida-workbench-$VERSION-windows-x64.exe"
          file="artifacts/$asset"
          if [ ! -s "$file" ]; then
            echo "::error::missing or empty release asset: $file"
            exit 1
          fi

          # Annotated tags point at tag objects; peel them to the actual commit.
          # Refuse to publish if the tag was deleted or moved during the build.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          type=$(jq -r '.object.type' <<< "$ref")
          commit=$(jq -r '.object.sha' <<< "$ref")
          while [ "$type" = tag ]; do
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$commit")
            type=$(jq -r '.object.type' <<< "$ref")
            commit=$(jq -r '.object.sha' <<< "$ref")
          done
          if [ "$type" != commit ] || [ "$commit" != "$BUILD_COMMIT" ]; then
            echo "::error::tag $TAG no longer points at the built commit $BUILD_COMMIT"
            exit 1
          fi

          if release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets); then
            if [ "$(jq -r '.isDraft' <<< "$release")" = false ]; then
              if jq -e --arg name "$asset" '.assets | any(.name == $name)' >/dev/null <<< "$release"; then
                echo "release $TAG already carries $asset; nothing to publish"
                exit 0
              fi
              echo "::error::release $TAG is already public without $asset; use a new version tag"
              exit 1
            fi
          else
            # --verify-tag refuses to manufacture a tag. Keep the release private
            # until the binary is attached; an upload failure leaves only a draft.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "IDA Workbench $TAG" --generate-notes --draft
          fi

          # A rerun can finish an interrupted draft, but cannot alter a public release.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$file" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
